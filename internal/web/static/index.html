<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Control Center</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-border: #232f48;
      --card-border-hover: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --badge-bg: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    
    .system-badges { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .badge { background: var(--card-bg); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .badge-val { font-weight: 600; color: var(--primary); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: #334155; }
    .card.is-active { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.1); }
    
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .card-id-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #fbbf24;
      padding: 0;
      line-height: 1;
      transition: transform 0.1s;
    }
    .fav-btn:hover { transform: scale(1.2); }
    .card-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-engine {
      font-size: 11px;
      color: var(--text-muted);
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    
    .card-top-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-action-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .card-action-icon:hover { color: #fff; background: #1e293b; }
    
    .status-pill {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .status-running { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
    .status-stopped { background: rgba(148, 163, 184, 0.08); color: var(--text-muted); border: 1px solid var(--card-border); }
    .status-starting { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
    
    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      line-height: 1.4;
      word-break: break-word;
      min-height: 42px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      font-size: 12px;
      color: var(--text-muted);
      background: #0d1322;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1a233a;
    }
    .meta-item { display: flex; justify-content: space-between; }
    .meta-item b { color: var(--text); font-weight: 500; font-family: monospace; }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }
    .profile-select-wrapper { width: 100%; }
    
    select, input, textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: #0d1322;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--primary); }
    select:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-group.running {
      grid-template-columns: 1fr 1fr 1fr;
    }
    
    button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: #1e293b;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
      white-space: nowrap;
    }
    button:hover { background: #2b3a55; }
    button.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-success { background: var(--success); border-color: var(--success); color: #fff; font-weight: 600; }
    button.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
    button.btn-danger:hover { background: var(--danger-hover); }
    
    .logs-panel {
      margin-top: 30px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    pre#logs {
      background: #000;
      color: #10b981;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      padding: 14px;
      border-radius: 8px;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      border: 1px solid #1e293b;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid var(--card-border);
    }
    .modal-body {
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 22px;
      border-top: 1px solid var(--card-border);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>⚡ LLM Control Center</h1>
      <div style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">Intel Arc A770 / Vulkan & SYCL LLM Engine</div>
    </div>
    <div class="system-badges">
      <div class="badge">🧠 RAM: <span id="ram-badge" class="badge-val">--</span></div>
      <div class="badge">🎮 VRAM: <span id="vram-badge" class="badge-val">--</span></div>
      <button class="btn-success" onclick="openAddModal()">➕ Add Model</button>
      <button class="btn-danger" onclick="stopAll()">⏹ Stop All</button>
      <button onclick="loadAll()">🔄 Refresh</button>
    </div>
  </header>

  <div class="grid" id="models-grid"></div>

  <div class="logs-panel">
    <div class="logs-header">
      <h3 style="font-size: 15px;">📜 Live Logs: <span id="log-model-name" style="color: var(--primary);">выберите модель</span></h3>
      <div>
        <button onclick="refreshLogs()">Обновить логи</button>
      </div>
    </div>
    <pre id="logs">Выберите модель для просмотра логов...</pre>
  </div>

  <!-- Modal for Add/Edit Model -->
  <div class="modal-backdrop" id="model-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title" style="font-size: 18px;">Добавить модель</h2>
        <button class="card-action-icon" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label>ID Модели (slug)</label>
            <input type="text" id="m-id" placeholder="например: qwen14b" />
          </div>
          <div class="form-group">
            <label>Название</label>
            <input type="text" id="m-name" placeholder="например: Qwen 3.5 14B" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Движок</label>
            <select id="m-engine">
              <option value="llama-vk">Llama.cpp Vulkan (llama-vk)</option>
              <option value="llama-sycl">Llama.cpp Intel SYCL (llama-sycl)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Порт по умолчанию</label>
            <input type="number" id="m-port" value="8080" />
          </div>
        </div>

        <div class="form-group">
          <label>Путь к модели (.gguf)</label>
          <input type="text" id="m-path" placeholder="/home/.../model.gguf" />
        </div>

        <div class="form-group">
          <label>Путь к mmproj (Vision, опц.)</label>
          <input type="text" id="m-mmproj" placeholder="/home/.../mmproj.gguf" />
        </div>

        <div class="form-group">
          <label>Путь к MTP спекулятору (опц.)</label>
          <input type="text" id="m-mtp" placeholder="/home/.../assistant-mtp.gguf" />
        </div>

        <div class="form-group">
          <label>Профиль по умолчанию</label>
          <input type="text" id="m-def-profile" value="default" />
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeModal()">Отмена</button>
        <button class="btn-primary" onclick="saveModelForm()">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    let activeLogModel = "";
    let isEditMode = false;
    let allModels = [];

    async function loadAll() {
      try {
        const [statusRes, modelsRes] = await Promise.all([
          fetch('/api/status').then(r => r.json()),
          fetch('/api/models').then(r => r.json())
        ]);
        allModels = modelsRes;

        document.getElementById('ram-badge').innerText = `${statusRes.system.ram_used_mb} / ${statusRes.system.ram_total_mb} MB (${statusRes.system.ram_usage_pct.toFixed(0)}%)`;
        if (statusRes.system.vram_total_mb > 0) {
          document.getElementById('vram-badge').innerText = `${statusRes.system.vram_used_mb} / ${statusRes.system.vram_total_mb} MB (${statusRes.system.vram_usage_pct.toFixed(0)}%)`;
        } else {
          document.getElementById('vram-badge').innerText = `Shared / Vulkan`;
        }

        renderModels(modelsRes);
      } catch (err) {
        console.error("Failed to load status/models:", err);
      }
    }

    function renderModels(models) {
      const grid = document.getElementById('models-grid');
      grid.innerHTML = '';

      models.forEach(m => {
        const isRunning = m.runtime && m.runtime.status === 'running';
        const isStarting = m.runtime && m.runtime.status === 'starting';
        const statusClass = isRunning ? 'status-running' : (isStarting ? 'status-starting' : 'status-stopped');
        const statusText = isRunning ? 'RUNNING' : (isStarting ? 'STARTING...' : 'STOPPED');

        const card = document.createElement('div');
        card.className = `card ${isRunning ? 'is-active' : ''}`;
        
        let buttonGroupHTML = '';
        if (isRunning) {
          buttonGroupHTML = `
            <div class="btn-group running">
              <button class="btn-danger" onclick="stopModel('${m.id}')">⏹ Stop</button>
              <button onclick="benchModel('${m.id}')">🧪 Bench</button>
              <button onclick="showLogs('${m.id}')">📜 Logs</button>
            </div>
          `;
        } else {
          buttonGroupHTML = `
            <div class="btn-group">
              <button class="btn-primary" onclick="startModel('${m.id}')">▶ Start</button>
              <button onclick="showLogs('${m.id}')">📜 Logs</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-top">
            <div class="card-id-wrapper">
              <button class="fav-btn" onclick="toggleFav('${m.id}', ${!m.is_favorite})" title="В избранное">${m.is_favorite ? '★' : '☆'}</button>
              <span class="card-id" title="${m.id}">${m.id}</span>
              <span class="card-engine">${m.engine_id}</span>
            </div>
            <div class="card-top-right">
              <span class="status-pill ${statusClass}">${statusText}</span>
              <button class="card-action-icon" onclick="openEditModal('${m.id}')" title="Редактировать">✏️</button>
              <button class="card-action-icon" onclick="deleteModel('${m.id}')" title="Удалить">🗑</button>
            </div>
          </div>

          <div class="card-name" title="${m.name}">${m.name}</div>

          <div class="meta-grid">
            <div class="meta-item"><span>Port:</span> <b>${m.default_port}</b></div>
            <div class="meta-item"><span>PID:</span> <b>${m.runtime ? m.runtime.pid || '-' : '-'}</b></div>
            <div class="meta-item"><span>MTP Spec:</span> <b>${m.mtp_path ? 'Yes' : 'No'}</b></div>
            <div class="meta-item"><span>Vision:</span> <b>${m.mmproj_path ? 'Yes' : 'No'}</b></div>
          </div>

          <div class="controls">
            <div class="profile-select-wrapper">
              <select id="prof-${m.id}" ${isRunning ? 'disabled' : ''}>
                ${(m.profiles || []).map(p => `<option value="${p.name}" ${p.name === (m.runtime?.profile_name || m.default_profile) ? 'selected' : ''}>Profile: ${p.name} (ctx ${p.ctx_size})</option>`).join('')}
              </select>
            </div>
            ${buttonGroupHTML}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function startModel(id) {
      const select = document.getElementById(`prof-${id}`);
      const profile = select ? select.value : 'default';
      await fetch(`/api/models/${id}/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile })
      });
      loadAll();
      showLogs(id);
    }

    async function stopModel(id) {
      await fetch(`/api/models/${id}/stop`, { method: 'POST' });
      loadAll();
    }

    async function stopAll() {
      await fetch(`/api/models/stop-all`, { method: 'POST' });
      loadAll();
    }

    async function toggleFav(id, fav) {
      await fetch(`/api/models/${id}/favorite`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ favorite: fav })
      });
      loadAll();
    }

    async function benchModel(id) {
      const pre = document.getElementById('logs');
      pre.innerText = `Running benchmark on ${id} (prompt 7*8=)...`;
      const res = await fetch(`/api/models/${id}/bench`, { method: 'POST' }).then(r => r.json());
      pre.innerText = JSON.stringify(res, null, 2);
    }

    async function showLogs(id) {
      activeLogModel = id;
      document.getElementById('log-model-name').innerText = id;
      refreshLogs();
    }

    async function refreshLogs() {
      if (!activeLogModel) return;
      const logs = await fetch(`/api/models/${activeLogModel}/logs?lines=60`).then(r => r.text());
      document.getElementById('logs').innerText = logs || "(нет записей)";
    }

    // Modal Add / Edit
    function openAddModal() {
      isEditMode = false;
      document.getElementById('modal-title').innerText = 'Добавить модель';
      document.getElementById('m-id').value = '';
      document.getElementById('m-id').disabled = false;
      document.getElementById('m-name').value = '';
      document.getElementById('m-engine').value = 'llama-vk';
      document.getElementById('m-port').value = 8080;
      document.getElementById('m-path').value = '';
      document.getElementById('m-mmproj').value = '';
      document.getElementById('m-mtp').value = '';
      document.getElementById('m-def-profile').value = 'default';
      document.getElementById('model-modal').classList.add('open');
    }

    function openEditModal(id) {
      const m = allModels.find(item => item.id === id);
      if (!m) return;

      isEditMode = true;
      document.getElementById('modal-title').innerText = 'Редактировать модель';
      document.getElementById('m-id').value = m.id;
      document.getElementById('m-id').disabled = true;
      document.getElementById('m-name').value = m.name;
      document.getElementById('m-engine').value = m.engine_id;
      document.getElementById('m-port').value = m.default_port;
      document.getElementById('m-path').value = m.model_path;
      document.getElementById('m-mmproj').value = m.mmproj_path || '';
      document.getElementById('m-mtp').value = m.mtp_path || '';
      document.getElementById('m-def-profile').value = m.default_profile || 'default';
      document.getElementById('model-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('model-modal').classList.remove('open');
    }

    async function saveModelForm() {
      const id = document.getElementById('m-id').value.trim();
      const name = document.getElementById('m-name').value.trim();
      const engine_id = document.getElementById('m-engine').value;
      const default_port = parseInt(document.getElementById('m-port').value) || 8080;
      const model_path = document.getElementById('m-path').value.trim();
      const mmproj_path = document.getElementById('m-mmproj').value.trim();
      const mtp_path = document.getElementById('m-mtp').value.trim();
      const default_profile = document.getElementById('m-def-profile').value.trim() || 'default';

      if (!id || !name || !model_path) {
        alert('Заполните обязательные поля: ID, Название и Путь к модели');
        return;
      }

      const payload = {
        id,
        name,
        engine_id,
        default_port,
        model_path,
        mmproj_path,
        mtp_path,
        default_profile
      };

      if (!isEditMode) {
        payload.profiles = [
          { name: 'default', ctx_size: 4096, kv_type: 'q8_0', flash_attn: 'auto', enable_ui: true }
        ];
        await fetch('/api/models', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } else {
        await fetch(`/api/models/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }

      closeModal();
      loadAll();
    }

    async function deleteModel(id) {
      if (!confirm(`Удалить модель ${id}?`)) return;
      await fetch(`/api/models/${id}`, { method: 'DELETE' });
      loadAll();
    }

    // SSE events for realtime updates
    const evtSource = new EventSource('/api/events');
    evtSource.onmessage = () => {
      loadAll();
      if (activeLogModel) refreshLogs();
    };

    loadAll();
    setInterval(loadAll, 5000);
  </script>
</body>
</html>
